services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
