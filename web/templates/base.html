<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MoneyManage Admin{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        nav ul li a.active { font-weight: bold; text-decoration: underline; }
        .flash { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .flash.success { background: #1b5e20; color: #a5d6a7; }
        .flash.error { background: #b71c1c; color: #ef9a9a; }
        .flash.info { background: #0d47a1; color: #90caf9; }
        table form { display: inline; margin: 0; }
        table form button { margin: 0; padding: 0.25rem 0.5rem; font-size: 0.85rem; }
        .amount { font-family: monospace; text-align: right; }
        .text-right { text-align: right; }
        .text-green { color: #66bb6a; }
        .text-red { color: #ef5350; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { padding: 1rem; border: 1px solid #444; border-radius: 8px; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 0.9rem; color: #aaa; }
        .stat-card p { margin: 0.5rem 0 0; font-size: 1.5rem; font-weight: bold; }
        .panel { border: 1px solid #444; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .panel summary { font-weight: bold; font-size: 1.05rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>MoneyManage</strong></li>
        </ul>
        <ul>
            <li><a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/transactions" class="{% if active == 'transactions' %}active{% endif %}">Transactions</a></li>
            <li><a href="/categories" class="{% if active == 'categories' %}active{% endif %}">Categories</a></li>
            <li><a href="/spaces" class="{% if active == 'spaces' %}active{% endif %}">Spaces</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>
    <main class="container">
        {% for msg in messages|default([]) %}
        <div class="flash {{ msg.category }}">{{ msg.message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
