<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MoneyManage Admin{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="container-fluid" x-data="{ navOpen: false }">
        <ul>
            <li class="nav-brand"><strong>MoneyManage</strong></li>
        </ul>
        <button class="nav-toggle" @click="navOpen = !navOpen" aria-label="Menu">&#9776;</button>
        <ul class="nav-links" :class="{ 'open': navOpen }" @click="navOpen = false">
            <li><a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/transactions" class="{% if active == 'transactions' %}active{% endif %}">Transactions</a></li>
            <li><a href="/categories" class="{% if active == 'categories' %}active{% endif %}">Categories</a></li>
            <li><a href="/spaces" class="{% if active == 'spaces' %}active{% endif %}">Spaces</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <!-- Toast notifications -->
    <div class="toast-container" x-data>
        <template x-for="t in $store.toast.messages" :key="t.id">
            <div class="toast" :class="t.type" x-text="t.message"></div>
        </template>
    </div>

    <!-- Main content -->
    <main class="container">
        {% for msg in messages|default([]) %}
        <div class="flash {{ msg.category }}">{{ msg.message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <!-- FAB: Quick Expense -->
    <div x-data="fabExpense()" x-cloak>
        <button class="fab" @click="openModal()" title="Quick expense">+</button>

        <div x-show="showModal" x-cloak class="fab-overlay" @click.self="showModal = false">
                <div class="fab-modal">
                    <h3>Quick Expense</h3>
                    <div class="form-row">
                        <label>Type</label>
                        <select x-model="form.type">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="grid-2">
                        <div class="form-row">
                            <label>Amount</label>
                            <input type="text" inputmode="decimal" x-model="form.amount"
                                   placeholder="0.00">
                        </div>
                        <div class="form-row">
                            <label>Category</label>
                            <select x-model="form.category_name">
                                <option value="">Select...</option>
                                <template x-for="c in categories" :key="c.id">
                                    <option :value="c.name" x-text="c.name + ' (' + c.type + ')'"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-row">
                            <label>User</label>
                            <select x-model="form.created_by_telegram_id">
                                <template x-for="u in users" :key="u.id">
                                    <option :value="u.telegram_id" x-text="u.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Date</label>
                            <input type="date" x-model="form.happened_at">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Note</label>
                        <input type="text" x-model="form.note" placeholder="Optional">
                    </div>
                    <div class="form-actions">
                        <button @click="showModal = false" class="secondary">Cancel</button>
                        <button @click="submit()" :disabled="loading"
                                x-text="loading ? 'Saving...' : 'Add'"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
