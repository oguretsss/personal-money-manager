services:
  api:
    build: ./api
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8001"
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./web
    env_file: .env
    depends_on:
      - api
    ports:
      - "8002:8002"
    restart: unless-stopped
