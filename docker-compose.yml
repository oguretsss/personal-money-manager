services:
  api:
    build: ./api
    environment:
      API_ADMIN_TOKEN: "${API_ADMIN_TOKEN:?API_ADMIN_TOKEN is required}"
      API_BOT_TOKEN: "${API_BOT_TOKEN:?API_BOT_TOKEN is required}"
      DB_PATH: "${DB_PATH:-data/budget.sqlite}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-false}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://api:8001}"
      API_BOT_TOKEN: "${API_BOT_TOKEN:?API_BOT_TOKEN is required}"
      BOT_TOKEN: "${BOT_TOKEN:?BOT_TOKEN is required}"
      TZ: "${TZ:-Europe/Berlin}"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./web
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      API_ADMIN_TOKEN: "${API_ADMIN_TOKEN:?API_ADMIN_TOKEN is required}"
      API_BASE_URL: "${API_BASE_URL:-http://api:8001}"
      TZ: "${TZ:-Europe/Berlin}"
      WEB_SECRET_KEY: "${WEB_SECRET_KEY:?WEB_SECRET_KEY is required}"
    depends_on:
      - api
    ports:
      - "8002:8002"
    restart: unless-stopped
